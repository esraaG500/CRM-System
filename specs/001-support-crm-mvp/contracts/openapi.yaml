        content: { application/json: { schema: { $ref: '#/components/schemas/WebhookSubscription' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookSubscription' } } } }
    delete:
      tags: [Integrations]
      responses:
        '204': { description: Deleted }
  /admin/webhooks/{webhookId}/deliveries:
    parameters: [ { name: webhookId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [Integrations]
      responses:
        '200': { description: Recent deliveries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } } } } }
  /admin/erp:
    get:
      tags: [Integrations]
      responses:
        '200': { description: ERP connection (secrets masked), content: { application/json: { schema: { $ref: '#/components/schemas/ErpConnection' } } } }
    put:
      tags: [Integrations]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ErpConnection' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/ErpConnection' } } } }

  # ---------------------------------------------------------------- Files
  /files/{attachmentId}:
    parameters: [ { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [Files]
      summary: Download attachment (authorization checked against owning record)
      responses:
        '200': { description: File, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    apiKey: { type: apiKey, in: header, name: X-Api-Key }

  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    CustomerId: { name: customerId, in: path, required: true, schema: { type: string, format: uuid } }
    TicketId: { name: ticketId, in: path, required: true, schema: { type: string, format: uuid } }
    From: { name: from, in: query, schema: { type: string, format: date } }
    To: { name: to, in: query, schema: { type: string, format: date } }
    DeptFilter: { name: departmentId, in: query, schema: { type: string, format: uuid } }
    BranchFilter: { name: branchId, in: query, schema: { type: string, format: uuid } }

  responses:
    ValidationError:
      description: Validation failed
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ValidationProblemDetails' } } }
    Unauthorized:
      description: Not authenticated
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Forbidden:
      description: Not permitted
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    NotFound:
      description: Not found (also returned for records outside the caller's data scope)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Conflict:
      description: Stale version or invalid state; body includes `currentVersion`
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    TooManyRequests:
      description: Rate limited
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    AiUnavailable:
      description: AI service temporarily unavailable
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }

  schemas:
    # ---------- common
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: 'Stable machine code, e.g. ticket.invalid-transition' }
        correlationId: { type: string }
        currentVersion: { type: string }
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
    PageMeta:
      type: object
      required: [page, pageSize, totalCount]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
    Language: { type: string, enum: [ar, en] }
    Channel: { type: string, enum: [Email, WhatsApp, Sms, LiveChat, WebForm, Portal, Phone, Api] }
    UserRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
    NamedRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        nameEn: { type: string }
        nameAr: { type: string }

    # ---------- auth
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    TwoFactorChallenge:
      type: object
      properties:
        challengeId: { type: string }
    AuthResult:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: seconds }
        user: { $ref: '#/components/schemas/CurrentUser' }
    CurrentUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string }
        userType: { type: string, enum: [Staff, Customer] }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        departmentIds: { type: array, items: { type: string, format: uuid } }
        branchId: { type: [string, 'null'], format: uuid }
        preferredLanguage: { $ref: '#/components/schemas/Language' }

    # ---------- customers
    CustomerType: { type: string, enum: [Individual, Company] }
    Address:
      type: object
      properties:
        line1: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        country: { type: string, maxLength: 2, description: ISO 3166-1 alpha-2 }
    CustomerUpsert:
      type: object
      required: [type, name]
      properties:
        type: { $ref: '#/components/schemas/CustomerType' }
        name: { type: string, maxLength: 200 }
        primaryEmail: { type: [string, 'null'], format: email }
        primaryPhone: { type: [string, 'null'], pattern: '^\+[1-9][0-9]{6,14}$' }
        additionalEmails: { type: array, items: { type: string, format: email } }
        additionalPhones: { type: array, items: { type: string } }
        address: { $ref: '#/components/schemas/Address' }
        preferredLanguage: { $ref: '#/components/schemas/Language' }
        branchId: { type: [string, 'null'], format: uuid }
        tags: { type: array, items: { type: string } }
        erpReference: { type: [string, 'null'], maxLength: 64 }
        version: { type: string, description: Required on update }
    CustomerSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        referenceNumber: { type: string }
        type: { $ref: '#/components/schemas/CustomerType' }
        name: { type: string }
        primaryEmail: { type: [string, 'null'] }
        primaryPhone: { type: [string, 'null'] }
        openTicketCount: { type: integer }
        needsReview: { type: boolean }
    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerUpsert'
        - type: object
          properties:
            id: { type: string, format: uuid }
            referenceNumber: { type: string }
            needsReview: { type: boolean }
            contacts: { type: array, items: { $ref: '#/components/schemas/ContactPerson' } }
            createdAt: { type: string, format: date-time }
            version: { type: string }
    CustomerSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/CustomerSummary' } } }
    ContactPersonUpsert:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 150 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        jobTitle: { type: [string, 'null'] }
        isPrimary: { type: boolean }
    ContactPerson:
      allOf:
        - $ref: '#/components/schemas/ContactPersonUpsert'
        - type: object
          properties: { id: { type: string, format: uuid } }
    TimelineItem:
      type: object
      properties:
        kind: { type: string, enum: [Ticket, Message, Note, Attachment, Feedback] }
        occurredAt: { type: string, format: date-time }
        title: { type: string }
        excerpt: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        ticketId: { type: [string, 'null'], format: uuid }
        actor: { $ref: '#/components/schemas/UserRef' }
    TimelinePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/TimelineItem' } } }
    NoteCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 4000 }
    Note:
      type: object
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        author: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
    AttachmentInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, maximum: 10485760 }
        downloadUrl: { type: string }
    ErpCustomerInfo:
      type: object
      properties:
        erpReference: { type: string }
        displayName: { type: string }
        balance: { type: [number, 'null'] }
        currency: { type: [string, 'null'] }
        recentOrders:
          type: array
          items:
            type: object
            properties:
              number: { type: string }
              date: { type: string, format: date }
              total: { type: number }
              status: { type: string }
        recentInvoices:
          type: array
          items:
            type: object
            properties:
              number: { type: string }
              date: { type: string, format: date }
              amount: { type: number }
              status: { type: string }
        retrievedAt: { type: string, format: date-time }

    # ---------- tickets
    TicketStatus: { type: string, enum: [New, Open, InProgress, PendingCustomer, Resolved, Closed] }
    TicketPriority: { type: string, enum: [Low, Medium, High, Urgent] }
    SlaInfo:
      type: object
      properties:
        firstResponseDueAt: { type: [string, 'null'], format: date-time }
        resolutionDueAt: { type: [string, 'null'], format: date-time }
        firstRespondedAt: { type: [string, 'null'], format: date-time }
        isPaused: { type: boolean }
        state: { type: string, enum: [onTrack, atRisk, breached, met, none] }
        firstResponseBreached: { type: boolean }
        resolutionBreached: { type: boolean }
    TicketCreate:
      type: object
      required: [subject, description, customerId, categoryId]
      properties:
        subject: { type: string, maxLength: 250 }
        description: { type: string, maxLength: 20000 }
        customerId: { type: string, format: uuid }
        contactPersonId: { type: [string, 'null'], format: uuid }
        channel: { $ref: '#/components/schemas/Channel' }
        categoryId: { type: string, format: uuid }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        departmentId: { type: [string, 'null'], format: uuid, description: Defaults from category }
        assigneeId: { type: [string, 'null'], format: uuid }
        attachmentIds: { type: array, items: { type: string, format: uuid } }
    TicketUpdate:
      type: object
      required: [version]
      properties:
        subject: { type: string, maxLength: 250 }
        categoryId: { type: string, format: uuid }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        departmentId: { type: string, format: uuid }
        version: { type: string }
    TicketSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        referenceNumber: { type: string }
        subject: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        channel: { $ref: '#/components/schemas/Channel' }
        customer: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } }
        assignee: { $ref: '#/components/schemas/UserRef' }
        category: { $ref: '#/components/schemas/NamedRef' }
        department: { $ref: '#/components/schemas/NamedRef' }
        sla: { $ref: '#/components/schemas/SlaInfo' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Ticket:
      allOf:
        - $ref: '#/components/schemas/TicketSummary'
        - type: object
          properties:
            description: { type: string }
            contactPerson: { $ref: '#/components/schemas/ContactPerson' }
            branch: { $ref: '#/components/schemas/NamedRef' }
            escalationLevel: { type: integer }
            resolvedAt: { type: [string, 'null'], format: date-time }
            closedAt: { type: [string, 'null'], format: date-time }
            aiSuggestion: { $ref: '#/components/schemas/AiClassification' }
            attachments: { type: array, items: { $ref: '#/components/schemas/AttachmentInfo' } }
            allowedTransitions: { type: array, items: { $ref: '#/components/schemas/TicketStatus' } }
            version: { type: string }
    TicketSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/TicketSummary' } } }
    TicketHistoryEntry:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/UserRef' }
        changeType: { type: string, enum: [Created, FieldChanged, Assigned, StatusChanged, Escalated, SlaBreached, Merged, Reopened] }
        field: { type: [string, 'null'] }
        oldValue: { type: [string, 'null'] }
        newValue: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }

    # ---------- messages
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        direction: { type: string, enum: [Inbound, Outbound] }
        isInternal: { type: boolean }
        isFromBot: { type: boolean }
        channel: { $ref: '#/components/schemas/Channel' }
        body: { type: string }
        sender: { type: object, properties: { kind: { type: string, enum: [Agent, Customer, System, Bot] }, id: { type: [string, 'null'], format: uuid }, name: { type: string } } }
        mentions: { type: array, items: { $ref: '#/components/schemas/UserRef' } }
        attachments: { type: array, items: { $ref: '#/components/schemas/AttachmentInfo' } }
        deliveryStatus: { type: [string, 'null'], enum: [Pending, Sent, Delivered, Read, Failed, null] }
        deliveryError: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    ReplyCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 20000 }
        channel: { $ref: '#/components/schemas/Channel' }
        attachmentIds: { type: array, items: { type: string, format: uuid } }
        setStatus: { $ref: '#/components/schemas/TicketStatus' }
        usedAiSuggestion: { type: boolean }
    InternalNoteCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 20000 }
        mentionUserIds: { type: array, items: { type: string, format: uuid } }

    # ---------- dashboard / tasks / quick replies / notifications
    AgentDashboard:
      type: object
      properties:
        countsByStatus: { type: object, additionalProperties: { type: integer } }
        atRisk: { type: array, items: { $ref: '#/components/schemas/TicketSummary' } }
        overdue: { type: array, items: { $ref: '#/components/schemas/TicketSummary' } }
        assigned: { type: array, items: { $ref: '#/components/schemas/TicketSummary' } }
        queueUnassignedCount: { type: integer }
        tasksDueToday: { type: array, items: { $ref: '#/components/schemas/TaskItem' } }
        unreadNotifications: { type: integer }
    TaskUpsert:
      type: object
      required: [title, dueAt]
      properties:
        title: { type: string, maxLength: 200 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        dueAt: { type: string, format: date-time }
        ticketId: { type: [string, 'null'], format: uuid }
        customerId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [Open, Done] }
    TaskItem:
      allOf:
        - $ref: '#/components/schemas/TaskUpsert'
        - type: object
          properties: { id: { type: string, format: uuid } }
    QuickReplyUpsert:
      type: object
      required: [title, body, language, scope]
      properties:
        title: { type: string, maxLength: 100 }
        body: { type: string, maxLength: 5000 }
        language: { $ref: '#/components/schemas/Language' }
        scope: { type: string, enum: [Shared, Personal] }
        departmentId: { type: [string, 'null'], format: uuid }
    QuickReply:
      allOf:
        - $ref: '#/components/schemas/QuickReplyUpsert'
        - type: object
          properties: { id: { type: string, format: uuid }, ownerId: { type: [string, 'null'], format: uuid } }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [Assigned, Mentioned, Reminder, SlaWarning, SlaBreached, Escalated, ChatWaiting] }
        title: { type: string }
        body: { type: string }
        link: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/Notification' } } }
    NotificationPreference:
      type: object
      properties:
        type: { type: string }
        inApp: { type: boolean }
        email: { type: boolean }
        mandatory: { type: boolean, readOnly: true }

    # ---------- SLA & automation
    SlaPolicy:
      type: object
      required: [name, priority, firstResponseMinutes, resolutionMinutes, calendarId]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 100 }
        departmentId: { type: [string, 'null'], format: uuid }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        firstResponseMinutes: { type: integer, minimum: 1 }
        resolutionMinutes: { type: integer, minimum: 1 }
        calendarId: { type: string, format: uuid }
        warningThresholdPercent: { type: integer, minimum: 1, maximum: 99, default: 80 }
        isActive: { type: boolean }
    BusinessCalendar:
      type: object
      required: [name, timeZoneId, workingHours]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        timeZoneId: { type: string, default: Asia/Riyadh }
        workingHours:
          type: array
          items:
            type: object
            required: [dayOfWeek, start, end]
            properties:
              dayOfWeek: { type: string, enum: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday] }
              start: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
              end: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        holidays:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              nameEn: { type: string }
              nameAr: { type: string }
    AssignmentRule:
      type: object
      required: [departmentId, strategy]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        departmentId: { type: string, format: uuid }
        categoryId: { type: [string, 'null'], format: uuid }
        strategy: { type: string, enum: [RoundRobin] }
        onlyAvailableAgents: { type: boolean, default: true }
        order: { type: integer }
        isActive: { type: boolean }
    EscalationRule:
      type: object
      required: [trigger, target]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        trigger: { type: string, enum: [SlaWarning, SlaBreach] }
        target: { type: string, enum: [FirstResponse, Resolution] }
        departmentId: { type: [string, 'null'], format: uuid }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        notifyUserIds: { type: array, items: { type: string, format: uuid } }
        notifyRole: { type: [string, 'null'] }
        notifyAssignee: { type: boolean, default: true }
        reassignToUserId: { type: [string, 'null'], format: uuid }
        raisePriority: { type: boolean }
        isActive: { type: boolean }

    # ---------- knowledge base
    ArticleType: { type: string, enum: [Faq, HelpArticle, Guide] }
    ArticleStatus: { type: string, enum: [Draft, Published, Unpublished] }
    KnowledgeCategory:
      type: object
      required: [nameEn, nameAr]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        nameEn: { type: string }
        nameAr: { type: string }
        parentId: { type: [string, 'null'], format: uuid }
        sortOrder: { type: integer }
    ArticleUpsert:
      type: object
      required: [type, title, body, language, categoryId, visibility]
      properties:
        type: { $ref: '#/components/schemas/ArticleType' }
        title: { type: string, maxLength: 250 }
        body: { type: string, description: Sanitized HTML }
        language: { $ref: '#/components/schemas/Language' }
        translationGroupId: { type: [string, 'null'], format: uuid }
        categoryId: { type: string, format: uuid }
        visibility: { type: string, enum: [Public, Internal] }
        version: { type: string }
    ArticleSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ArticleType' }
        title: { type: string }
        excerpt: { type: string }
        language: { $ref: '#/components/schemas/Language' }
        visibility: { type: string, enum: [Public, Internal] }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        url: { type: string, description: Public portal URL when Public+Published }
    Article:
      allOf:
        - $ref: '#/components/schemas/ArticleUpsert'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/ArticleStatus' }
            publishedAt: { type: [string, 'null'], format: date-time }
            viewCount: { type: integer }
            helpfulCount: { type: integer }
            notHelpfulCount: { type: integer }
            url: { type: string }
            version: { type: string }
    ArticleSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/ArticleSummary' } } }

    # ---------- AI
    AiSummary:
      type: object
      properties:
        issue: { type: string }
        actionsTaken: { type: string }
        currentState: { type: string }
        language: { $ref: '#/components/schemas/Language' }
        generatedAt: { type: string, format: date-time }
    AiSuggestedReply:
      type: object
      properties:
        body: { type: string }
        language: { $ref: '#/components/schemas/Language' }
        sourceArticleIds: { type: array, items: { type: string, format: uuid } }
    AiClassification:
      type: object
      properties:
        categoryId: { type: [string, 'null'], format: uuid }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        rationale: { type: string }

    # ---------- portal / public
    PortalTicketCreate:
      type: object
      required: [subject, description, categoryId]
      properties:
        subject: { type: string, maxLength: 250 }
        description: { type: string, maxLength: 20000 }
        categoryId: { type: string, format: uuid }
        attachmentIds: { type: array, items: { type: string, format: uuid } }
    PortalMessage:
      type: object
      description: Public message only (internal notes never included)
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [Inbound, Outbound] }
        body: { type: string }
        senderName: { type: string }
        attachments: { type: array, items: { $ref: '#/components/schemas/AttachmentInfo' } }
        createdAt: { type: string, format: date-time }
    PortalTicket:
      type: object
      properties:
        id: { type: string, format: uuid }
        referenceNumber: { type: string }
        subject: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        category: { $ref: '#/components/schemas/NamedRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messages: { type: array, items: { $ref: '#/components/schemas/PortalMessage' } }
        canGiveFeedback: { type: boolean }
    PortalTicketPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/PortalTicket' } } }
    FeedbackCreate:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, 'null'], maxLength: 1000 }
    WebFormSubmission:
      type: object
      required: [name, email, categoryId, subject, description, captchaToken]
      properties:
        name: { type: string, maxLength: 150 }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        categoryId: { type: string, format: uuid }
        subject: { type: string, maxLength: 250 }
        description: { type: string, maxLength: 20000 }
        language: { $ref: '#/components/schemas/Language' }
        captchaToken: { type: string }
    Branding:
      type: object
      properties:
        systemNameEn: { type: string }
        systemNameAr: { type: string }
        logoUrl: { type: [string, 'null'] }
        primaryColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        emailFooterEn: { type: string }
        emailFooterAr: { type: string }

    # ---------- reports
    ManagementDashboard:
      type: object
      properties:
        openTickets: { type: integer }
        newToday: { type: integer }
        slaCompliancePercent: { type: number }
        avgFirstResponseMinutes: { type: number }
        avgResolutionMinutes: { type: number }
        avgSatisfaction: { type: number }
        byChannel: { type: object, additionalProperties: { type: integer } }
        byStatus: { type: object, additionalProperties: { type: integer } }
    ReportResult:
      type: object
      properties:
        reportType: { type: string }
        columns: { type: array, items: { type: object, properties: { key: { type: string }, labelEn: { type: string }, labelAr: { type: string }, type: { type: string, enum: [string, number, percent, duration, date] } } } }
        rows: { type: array, items: { type: object, additionalProperties: true } }
        totals: { type: object, additionalProperties: true }
        generatedAt: { type: string, format: date-time }

    # ---------- admin
    UserUpsert:
      type: object
      required: [email, fullName, roleIds, departmentIds]
      properties:
        email: { type: string, format: email }
        fullName: { type: string, maxLength: 150 }
        roleIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
        departmentIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
        branchId: { type: string, format: uuid }
        preferredLanguage: { $ref: '#/components/schemas/Language' }
        isAvailable: { type: boolean }
    User:
      allOf:
        - $ref: '#/components/schemas/UserUpsert'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [Active, Deactivated] }
            twoFactorEnabled: { type: boolean }
            lastSignInAt: { type: [string, 'null'], format: date-time }
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/User' } } }
    Role:
      type: object
      required: [name, permissions]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 50 }
        isSystem: { type: boolean, readOnly: true }
        permissions: { type: array, items: { type: string } }
    Department:
      type: object
      required: [nameEn, nameAr]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        nameEn: { type: string }
        nameAr: { type: string }
        escalationOwnerId: { type: [string, 'null'], format: uuid }
        isActive: { type: boolean }
    Branch:
      type: object
      required: [nameEn, nameAr]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        nameEn: { type: string }
        nameAr: { type: string }
        timeZoneId: { type: string, default: Asia/Riyadh }
        isActive: { type: boolean }
    Category:
      type: object
      required: [nameEn, nameAr]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        nameEn: { type: string }
        nameAr: { type: string }
        departmentId: { type: [string, 'null'], format: uuid }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    ChannelConfiguration:
      type: object
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        isEnabled: { type: boolean }
        defaultDepartmentId: { type: [string, 'null'], format: uuid }
        settings:
          type: object
          additionalProperties: true
          description: Provider-specific settings; secret values are write-only and returned masked (`***`)
        lastPolledAt: { type: [string, 'null'], format: date-time, readOnly: true }
        status: { type: string, enum: [Ok, Error, Disabled], readOnly: true }
    SystemSettings:
      type: object
      properties:
        organizationName: { type: string }
        timeZoneId: { type: string }
        defaultLanguage: { $ref: '#/components/schemas/Language' }
        reopenWindowDays: { type: integer, default: 7 }
        autoCloseResolvedAfterDays: { type: integer, default: 7 }
        priorityDisplayNames: { type: object, additionalProperties: { $ref: '#/components/schemas/NamedRef' } }
        branding: { $ref: '#/components/schemas/Branding' }
        ai:
          type: object
          properties:
            enabled: { type: boolean }
            summary: { type: boolean }
            suggestedReply: { type: boolean }
            classification: { type: boolean }
            suggestedArticles: { type: boolean }
            chatbot: { type: boolean }
        attachments:
          type: object
          properties:
            maxBytes: { type: integer, maximum: 10485760 }
            allowedTypes: { type: array, items: { type: string } }
    AuditLogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/UserRef' }
        apiKeyName: { type: [string, 'null'] }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, 'null'] }
        changes: { type: object, additionalProperties: true }
        ipAddress: { type: string }
        correlationId: { type: string }
    AuditLogPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditLogEntry' } } }

    # ---------- integrations
    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        permissions: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    WebhookSubscription:
      type: object
      required: [name, url, events]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        url: { type: string, format: uri, pattern: '^https://' }
        events: { type: array, items: { type: string, enum: [ticket.created, ticket.updated, ticket.status_changed, customer.created] } }
        isActive: { type: boolean }
        secret: { type: string, readOnly: true, description: Returned only on create }
    WebhookDelivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        attempt: { type: integer }
        responseStatus: { type: [integer, 'null'] }
        deliveredAt: { type: [string, 'null'], format: date-time }
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        failedPermanentlyAt: { type: [string, 'null'], format: date-time }
    ErpConnection:
      type: object
      properties:
        isEnabled: { type: boolean }
        baseUrl: { type: string, format: uri }
        authType: { type: string, enum: [ApiKey, Basic, OAuth2ClientCredentials] }
        credentials: { type: object, additionalProperties: { type: string }, writeOnly: true }
        customerEndpoint: { type: string, description: 'Path template, e.g. /customers/{erpReference}' }
        ordersEndpoint: { type: string }
        invoicesEndpoint: { type: string }
        cacheMinutes: { type: integer, default: 10 }
