openapi: 3.1.0
info:
  title: Customer Support CRM API
  version: 1.0.0
  description: |
    REST contract for the Customer Support CRM (feature 001-support-crm-mvp).
    - Base path: /api/v1
    - Auth: Bearer JWT (staff & portal users) or `X-Api-Key` (integrations).
    - Errors: RFC 7807 Problem Details (`application/problem+json`) with `correlationId`
      and, for validation, an `errors` map.
    - Lists: `page` (1-based), `pageSize` (default 25, max 100) → `PagedResult`.
    - Concurrency: mutable resources return `version` (base64 rowversion); send it back on
      PUT/PATCH; stale version → 409.
    - Localization: `Accept-Language: ar|en` for messages; bilingual fields are `nameEn`/`nameAr`.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - apiKey: []

tags:
  - name: Auth
  - name: Customers
  - name: Tickets
  - name: Messages
  - name: Channels
  - name: Dashboard
  - name: Tasks
  - name: QuickReplies
  - name: Notifications
  - name: Sla
  - name: Knowledge
  - name: Ai
  - name: Portal
  - name: Public
  - name: Reports
  - name: Admin
  - name: Integrations
  - name: Files

paths:
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in (staff or portal customer)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '202': { description: Two-factor code required, content: { application/json: { schema: { $ref: '#/components/schemas/TwoFactorChallenge' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/2fa/verify:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate refresh token (HttpOnly cookie) and get a new access token
      responses:
        '200': { description: Refreshed, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      responses:
        '204': { description: Signed out }
  /auth/me:
    get:
      tags: [Auth]
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/CurrentUser' } } } }
  /auth/password/forgot:
    post:
      tags: [Auth]
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '202': { description: Reset email sent if account exists }
  /auth/password/reset:
    post:
      tags: [Auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, email, newPassword]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                newPassword: { type: string, minLength: 10 }
      responses:
        '204': { description: Password changed }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- Customers (US2)
  /customers:
    get:
      tags: [Customers]
      summary: Search customers (name, email, phone, reference)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/CustomerType' } }
        - { name: branchId, in: query, schema: { type: string, format: uuid } }
        - { name: needsReview, in: query, schema: { type: boolean } }
        - { name: tag, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Page of customers, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerSummaryPage' } } } }
    post:
      tags: [Customers]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerUpsert' } } }
      responses:
        '201': { description: Created, headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /customers/{customerId}:
    parameters: [ { $ref: '#/components/parameters/CustomerId' } ]
    get:
      tags: [Customers]
      responses:
        '200': { description: Customer, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Customers]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerUpsert' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Customers]
      summary: Deactivate (soft delete) customer
      responses:
        '204': { description: Deactivated }
  /customers/{customerId}/contacts:
    parameters: [ { $ref: '#/components/parameters/CustomerId' } ]
    get:
      tags: [Customers]
      responses:
        '200': { description: Contacts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ContactPerson' } } } } }
    post:
      tags: [Customers]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ContactPersonUpsert' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ContactPerson' } } } }
  /customers/{customerId}/contacts/{contactId}:
    parameters:
      - { $ref: '#/components/parameters/CustomerId' }
      - { name: contactId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Customers]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ContactPersonUpsert' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ContactPerson' } } } }
    delete:
      tags: [Customers]
      responses:
        '204': { description: Removed }
  /customers/{customerId}/timeline:
    parameters: [ { $ref: '#/components/parameters/CustomerId' } ]
    get:
      tags: [Customers]
      summary: Interaction history (tickets, messages, notes, attachments, feedback)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Timeline, content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePage' } } } }
  /customers/{customerId}/notes:
    parameters: [ { $ref: '#/components/parameters/CustomerId' } ]
    post:
      tags: [Customers]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/NoteCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }
  /customers/{customerId}/attachments:
    parameters: [ { $ref: '#/components/parameters/CustomerId' } ]
    post:
      tags: [Customers, Files]
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '201': { description: Uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentInfo' } } } }
        '413': { description: File too large (> 10 MB), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '415': { description: File type not allowed, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /customers/{customerId}/merge:
    parameters: [ { $ref: '#/components/parameters/CustomerId' } ]
    post:
      tags: [Customers]
      summary: Merge a duplicate customer into this one (keeps all history)
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [duplicateCustomerId], properties: { duplicateCustomerId: { type: string, format: uuid } } }
      responses:
        '200': { description: Merged, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
  /customers/{customerId}/erp:
    parameters: [ { $ref: '#/components/parameters/CustomerId' } ]
    get:
      tags: [Customers, Integrations]
      summary: Read-only ERP information for linked customer
      responses:
        '200': { description: ERP data, content: { application/json: { schema: { $ref: '#/components/schemas/ErpCustomerInfo' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: ERP unavailable, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }

  # ---------------------------------------------------------------- Tickets (US1)
  /tickets:
    get:
      tags: [Tickets]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/TicketStatus' } }, style: form, explode: true }
        - { name: priority, in: query, schema: { type: array, items: { $ref: '#/components/schemas/TicketPriority' } }, style: form, explode: true }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: departmentId, in: query, schema: { type: string, format: uuid } }
        - { name: branchId, in: query, schema: { type: string, format: uuid } }
        - { name: assigneeId, in: query, description: "Use 'me' or 'unassigned' or a user id", schema: { type: string } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/Channel' } }
        - { name: slaState, in: query, schema: { type: string, enum: [onTrack, atRisk, breached] } }
        - { name: createdFrom, in: query, schema: { type: string, format: date } }
        - { name: createdTo, in: query, schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [createdAt, -createdAt, priority, dueAt], default: -createdAt } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Page of tickets, content: { application/json: { schema: { $ref: '#/components/schemas/TicketSummaryPage' } } } }
    post:
      tags: [Tickets]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TicketCreate' } } }
      responses:
        '201': { description: Created, headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /tickets/{ticketId}:
    parameters: [ { $ref: '#/components/parameters/TicketId' } ]
    get:
      tags: [Tickets]
      responses:
        '200': { description: Ticket, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tickets]
      summary: Update subject, category, priority, department
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/TicketUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /tickets/{ticketId}/assign:
    parameters: [ { $ref: '#/components/parameters/TicketId' } ]
    post:
      tags: [Tickets]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                assigneeId: { type: [string, 'null'], format: uuid, description: null = return to queue }
                departmentId: { type: string, format: uuid }
                version: { type: string }
      responses:
        '200': { description: Assigned, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tickets/{ticketId}/take:
    parameters: [ { $ref: '#/components/parameters/TicketId' } ]
    post:
      tags: [Tickets]
      summary: Agent takes an unassigned ticket from their department queue
      responses:
        '200': { description: Taken, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /tickets/{ticketId}/status:
    parameters: [ { $ref: '#/components/parameters/TicketId' } ]
    post:
      tags: [Tickets]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status, version]
              properties:
                status: { $ref: '#/components/schemas/TicketStatus' }
                reason: { type: string, maxLength: 500 }
                version: { type: string }
      responses:
        '200': { description: Status changed, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
        '409': { description: Invalid transition or stale version, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /tickets/{ticketId}/escalate:
    parameters: [ { $ref: '#/components/parameters/TicketId' } ]
    post:
      tags: [Tickets]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason, version]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                version: { type: string }
      responses:
        '200': { description: Escalated, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
  /tickets/{ticketId}/history:
    parameters: [ { $ref: '#/components/parameters/TicketId' } ]
    get:
      tags: [Tickets]
      responses:
        '200': { description: History, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TicketHistoryEntry' } } } } }
  /tickets/{ticketId}/notes:
    parameters: [ { $ref: '#/components/parameters/TicketId' } ]
    post:
      tags: [Tickets]
      summary: Internal note with optional mentions (never visible to customers)
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/InternalNoteCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
  /tickets/{ticketId}/attachments:
    parameters: [ { $ref: '#/components/parameters/TicketId' } ]
    post:
      tags: [Tickets, Files]
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '201': { description: Uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentInfo' } } } }
        '413': { description: Too large }
        '415': { description: Type not allowed }

  # ---------------------------------------------------------------- Messages / channels (US6)
  /tickets/{ticketId}/messages:
    parameters: [ { $ref: '#/components/parameters/TicketId' } ]
    get:
      tags: [Messages]
      parameters:
        - { name: includeInternal, in: query, schema: { type: boolean, default: true } }
      responses:
        '200': { description: Conversation, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Message' } } } } }
    post:
      tags: [Messages]
      summary: Reply to customer (sent on ticket channel unless overridden)
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplyCreate' } } }
      responses:
        '202': { description: Queued for delivery, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
  /tickets/{ticketId}/messages/{messageId}/retry:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Messages]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { channel: { $ref: '#/components/schemas/Channel' } } }
      responses:
        '202': { description: Re-queued, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
  /channels/whatsapp/webhook:
    get:
      tags: [Channels]
      security: []
      summary: Meta webhook verification (hub.challenge)
      responses:
        '200': { description: Challenge echoed }
    post:
      tags: [Channels]
      security: []
      summary: Inbound WhatsApp messages and delivery statuses (signature verified)
      responses:
        '200': { description: Accepted }
        '401': { description: Invalid signature }
  /channels/sms/webhook:
    post:
      tags: [Channels]
      security: []
      summary: Inbound SMS and delivery reports from SMS provider (signature/token verified)
      responses:
        '200': { description: Accepted }
        '401': { description: Invalid signature }

  # ---------------------------------------------------------------- Dashboard / tasks / quick replies / notifications (US4)
  /dashboard/agent:
    get:
      tags: [Dashboard]
      responses:
        '200': { description: Agent dashboard, content: { application/json: { schema: { $ref: '#/components/schemas/AgentDashboard' } } } }
  /tasks:
    get:
      tags: [Tasks]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [Open, Done] } }
        - { name: dueBefore, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: My tasks, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaskItem' } } } } }
    post:
      tags: [Tasks]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/TaskUpsert' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TaskItem' } } } }
  /tasks/{taskId}:
    parameters: [ { name: taskId, in: path, required: true, schema: { type: string, format: uuid } } ]
    put:
      tags: [Tasks]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/TaskUpsert' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/TaskItem' } } } }
    delete:
      tags: [Tasks]
      responses:
        '204': { description: Deleted }
  /quick-replies:
    get:
      tags: [QuickReplies]
      parameters:
        - { name: language, in: query, schema: { $ref: '#/components/schemas/Language' } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200': { description: Shared + personal quick replies, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/QuickReply' } } } } }
    post:
      tags: [QuickReplies]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/QuickReplyUpsert' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/QuickReply' } } } }
  /quick-replies/{quickReplyId}:
    parameters: [ { name: quickReplyId, in: path, required: true, schema: { type: string, format: uuid } } ]
    put:
      tags: [QuickReplies]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/QuickReplyUpsert' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/QuickReply' } } } }
    delete:
      tags: [QuickReplies]
      responses:
        '204': { description: Deleted }
  /quick-replies/{quickReplyId}/render:
    parameters: [ { name: quickReplyId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [QuickReplies]
      summary: Fill placeholders for a ticket
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [ticketId], properties: { ticketId: { type: string, format: uuid } } }
      responses:
        '200': { description: Rendered text, content: { application/json: { schema: { type: object, properties: { body: { type: string } } } } } }
  /notifications:
    get:
      tags: [Notifications]
      parameters:
        - { name: unreadOnly, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Notifications, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPage' } } } }
  /notifications/read:
    post:
      tags: [Notifications]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { ids: { type: array, items: { type: string, format: uuid } }, all: { type: boolean } } }
      responses:
        '204': { description: Marked read }
  /notifications/preferences:
    get:
      tags: [Notifications]
      responses:
        '200': { description: Preferences, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NotificationPreference' } } } } }
    put:
      tags: [Notifications]
      requestBody:
        content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NotificationPreference' } } } }
      responses:
        '204': { description: Saved }
        '400': { description: Attempt to mute a mandatory notification type }

  # ---------------------------------------------------------------- SLA & automation (US7)
  /sla/policies:
    get:
      tags: [Sla]
      responses:
        '200': { description: Policies, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SlaPolicy' } } } } }
    post:
      tags: [Sla]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/SlaPolicy' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SlaPolicy' } } } }
  /sla/policies/{policyId}:
    parameters: [ { name: policyId, in: path, required: true, schema: { type: string, format: uuid } } ]
    put:
      tags: [Sla]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/SlaPolicy' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SlaPolicy' } } } }
    delete:
      tags: [Sla]
      responses:
        '204': { description: Deleted }
  /sla/calendars:
    get:
      tags: [Sla]
      responses:
        '200': { description: Business calendars, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BusinessCalendar' } } } } }
    post:
      tags: [Sla]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/BusinessCalendar' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessCalendar' } } } }
  /sla/calendars/{calendarId}:
    parameters: [ { name: calendarId, in: path, required: true, schema: { type: string, format: uuid } } ]
    put:
      tags: [Sla]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/BusinessCalendar' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessCalendar' } } } }
  /automation/assignment-rules:
    get:
      tags: [Sla]
      responses:
